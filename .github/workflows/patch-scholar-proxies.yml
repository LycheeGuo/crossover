name: Patch Scholar proxies

permissions:
  contents: write

on:
  push:
    paths:
      - 'tools/patch_scholar_proxies.py'
      - '.github/workflows/patch-scholar-proxies.yml'
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Scholar proxy handling
        run: python3 tools/patch_scholar_proxies.py

      - name: Syntax check
        run: node --check _worker.js

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- _worker.js; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _worker.js
          git commit -m 'fix: support HTTPS proxies for Google Scholar'
          git push origin HEAD:main
