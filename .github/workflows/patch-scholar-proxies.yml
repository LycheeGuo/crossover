name: Patch Scholar proxies

permissions:
  contents: write

on:
  push:
    paths:
      - '.github/workflows/patch-scholar-proxies.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Scholar proxy handling
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('_worker.js')
          text = path.read_text(encoding='utf-8')

          old_pool = """const GOOGLE_SCHOLAR_PROXIES = [
    'http://82.66.253.131:9080',
    'http://46.30.160.47:7070',
    'http://102.134.49.165:6005',
    'http://118.163.198.107:1168',
    'http://211.75.210.107:1168'
];"""

          new_pool = """const GOOGLE_SCHOLAR_PROXIES = [
    // 2026-08-29 local Scholar reachability test: fastest HTTPS proxies first
    'https://203.236.17.77:8104',
    'https://45.79.220.116:443',
    'https://133.242.152.27:443',
    'https://3.92.137.124:443',
    'https://175.134.18.237:443',
    'https://132.208.244.66:443',
    'https://210.48.154.99:443',
    'https://52.1.130.127:443',
    'https://74.103.66.18:443',
    'https://52.140.7.131:443',
    // Preserve the original HTTP CONNECT pool as fallback
    'http://82.66.253.131:9080',
    'http://46.30.160.47:7070',
    'http://102.134.49.165:6005',
    'http://118.163.198.107:1168',
    'http://211.75.210.107:1168'
];"""

          if old_pool not in text:
              raise SystemExit('Expected GOOGLE_SCHOLAR_PROXIES block was not found; refusing unsafe patch')
          text = text.replace(old_pool, new_pool, 1)

          old_call = "newSocket = await httpConnect(host, portNum, 本次首包数据, false, TCP连接, scholarProxyConfig);"
          new_call = "const scholarProxyIsHTTPS = /^https:\\/\\//i.test(proxy);\n\t\t\t\t\tnewSocket = await httpConnect(host, portNum, 本次首包数据, scholarProxyIsHTTPS, TCP连接, scholarProxyConfig);"

          if old_call not in text:
              raise SystemExit('Expected Scholar httpConnect call was not found; refusing unsafe patch')
          text = text.replace(old_call, new_call, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Syntax check
        run: node --check _worker.js

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- _worker.js; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _worker.js
          git commit -m 'fix: support HTTPS proxies for Google Scholar'
          git push origin HEAD:main
